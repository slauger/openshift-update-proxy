name: Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test and Lint Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff (linting)
        run: ruff check src/ tests/ --output-format=github

      - name: Run black (code formatting check)
        run: black --check --diff src/ tests/

      - name: Run mypy (type checking)
        run: mypy src/

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: test
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Semantic Release
        id: semantic
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog: false

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    continue-on-error: true
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/openshift-update-proxy/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # runs last so a broken chart/container/testpypi publish never results
    # in a half-released version on the real pypi.org
    needs: [release, publish-testpypi, publish-chart, container]
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/openshift-update-proxy/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-chart:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Login to Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: helm package chart/ --version ${{ needs.release.outputs.version }} --app-version v${{ needs.release.outputs.version }}

      - name: Push chart
        run: helm push openshift-update-proxy-${{ needs.release.outputs.version }}.tgz oci://ghcr.io/slauger/charts

      - uses: oras-project/setup-oras@v2

      - name: Tag chart as latest
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
          oras tag ghcr.io/slauger/charts/openshift-update-proxy:${{ needs.release.outputs.version }} latest

  container:
    name: Build, Push and Sign Container Image
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/slauger/openshift-update-proxy
      PLATFORMS: linux/amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.3

      - uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          sbom: true
          # mode=max is what build-push-action already picks for public repos
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:v${{ needs.release.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Sign container image (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      # BuildKit attaches an SPDX SBOM to the image, but unsigned and
      # unreadable for CycloneDX-only consumers such as Dependency-Track.
      # syft generates both formats from the pushed platform images; they
      # are also published as release assets.
      - name: Generate SBOMs
        env:
          # Packages only: without this, every file owned by an RPM becomes a CycloneDX component
          SYFT_FILE_METADATA_SELECTION: none
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # The index also lists BuildKit attestation manifests (unknown/unknown),
          # so pick the image manifest by platform.
          INDEX=$(docker buildx imagetools inspect "${IMAGE}@${INDEX_DIGEST}" --format '{{json .Manifest}}')

          mkdir -p sbom
          for PLATFORM in ${PLATFORMS//,/ }; do
            DIGEST=$(jq -r --arg os "${PLATFORM%%/*}" --arg arch "${PLATFORM#*/}" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest' <<< "${INDEX}")
            if [[ -z "${DIGEST}" ]]; then
              echo "::error::no ${PLATFORM} image in ${IMAGE}@${INDEX_DIGEST}"
              exit 1
            fi
            BASE="sbom/openshift-update-proxy-${VERSION}-${PLATFORM//\//-}"
            syft scan "registry:${IMAGE}@${DIGEST}" \
              --source-name "${IMAGE}" --source-version "v${VERSION}" \
              -o "cyclonedx-json=${BASE}.cdx.json" \
              -o "spdx-json=${BASE}.spdx.json"
            echo "${DIGEST}" > "${BASE}.digest"
          done

      # An SBOM describes one platform image, so it is attested against the
      # platform digest rather than the index. :latest points at the same
      # platform image, so the attestation covers it as well.
      - name: Attest CycloneDX SBOMs with cosign (keyless)
        run: |
          for CDX in sbom/*.cdx.json; do
            DIGEST=$(cat "${CDX%.cdx.json}.digest")
            cosign attest --yes --type cyclonedx --predicate "${CDX}" "${IMAGE}@${DIGEST}"
          done

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-openshift-update-proxy
          path: sbom/*.json
          retention-days: 7

  release-assets:
    name: Attach SBOMs to GitHub Release
    runs-on: ubuntu-latest
    needs: [release, container]
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true

      - name: Upload SBOMs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v${{ needs.release.outputs.version }}" sbom/*.json
