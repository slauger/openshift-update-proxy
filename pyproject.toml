[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openshift-update-proxy"
version = "1.0.0"
description = "Forwarding proxy for OpenShift update resources (Cincinnati API, mirror, release signatures)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [
    {name = "Simon Lauger", email = "simon@lauger.de"},
]
keywords = ["openshift", "cincinnati", "update-graph", "proxy", "disconnected", "air-gapped"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "flask>=3.0.0",
    "requests>=2.31.0",
    "waitress>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
    "types-requests",
    "types-waitress",
]

[project.scripts]
openshift-update-proxy = "openshift_update_proxy.__main__:main"

[project.urls]
Repository = "https://github.com/slauger/openshift-update-proxy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "src/openshift_update_proxy/__init__.py:__version__",
]
branch = "master"
build_command = "pip install build && python -m build"
commit_parser = "angular"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
